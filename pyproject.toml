[project]
name = "control-system"
version = "0.2.0"
description = "Pneumatic pressing / vacuum control HMI on Raspberry Pi 5 (v1.12)"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.*",
    "pymodbus>=3.7,<4",
    "pyserial",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
